name: Validate Dataset Curator

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile application and catalog
        run: python -m py_compile dataset_curator_gui.py dataset_catalog.py

      - name: Verify review and caption-only features
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("dataset_curator_gui.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(path))
          app = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == "DatasetCuratorApp"
          )
          processor = next(
              node for node in tree.body
              if isinstance(node, ast.ClassDef) and node.name == "DatasetProcessor"
          )
          app_methods = {node.name for node in app.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))}
          processor_methods = {node.name for node in processor.body if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))}

          required_app = {
              "_build_review_tab", "_build_review_card", "_refresh_review_tab",
              "_save_review_caption", "_move_review_image", "_generate_review_caption",
              "_translate_review_caption", "_export_catalog", "_show_review_image",
              "_launch_review_catalog_load", "_handle_review_catalog_result",
              "_render_review_batch", "_remove_review_card_from_cache",
              "_append_log_lines", "_handle_export_result",
              "_mark_review_tabs_dirty_and_refresh_active",
          }
          required_processor = {"_process_caption_only", "_process_one"}
          missing = (required_app - app_methods) | (required_processor - processor_methods)
          assert not missing, f"Missing required methods: {sorted(missing)}"
          assert 'text="Выбранные"' in source
          assert 'text="Отбракованные"' in source
          assert 'text="📝 Только подписи"' in source
          assert "translate_en_ru(" in source
          assert "catalog.set_descriptions(source, description_en, description_ru)" in source
          assert "preview_size_var.set(" in source, "Review cards must show image dimensions"
          assert '"<Button-1>"' in source and "self._show_review_image(p)" in source
          assert '"Уместить"' in source and '"100%"' in source
          assert "zoom_with_wheel" in source, "Image viewer must support Ctrl+mouse-wheel zoom"
          assert "time.perf_counter() + 0.008" in source, "Queue polling must be time-bounded"
          assert "created < 4" in source, "Review cards must be created in small batches"
          assert 'name="DatasetCuratorReviewLoad-' in source
          assert 'name="DatasetCuratorExport"' in source, "Export must run outside the Tkinter event loop"
          poll_method = next(node for node in app.body if isinstance(node, ast.FunctionDef) and node.name == "_poll_queue")
          assert not any(
              isinstance(node, ast.While) and isinstance(node.test, ast.Constant) and node.test.value is True
              for node in ast.walk(poll_method)
          ), "Queue polling must not drain an unbounded queue in one UI tick"
          print("Syntax, asynchronous catalog loading, batched UI updates and required GUI/SQLite methods: OK")
          PY

      - name: Test SQLite catalog and explicit export
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import dataset_catalog
          from dataset_catalog import CatalogStore

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp) / "source"
              root.mkdir()
              photo = root / "portrait.jpg"
              photo.write_bytes(b"test image data; source file is intentionally opaque")
              catalog = CatalogStore(root)
              imported = catalog.sync_existing_files()
              assert imported == 1, imported
              row = catalog.get_image(photo)
              assert row and row["status"] == "pending", row

              catalog.upsert_analysis({
                  "status": "selected",
                  "reason": "",
                  "width": 1024,
                  "height": 1536,
                  "aesthetic_score": 5.6,
                  "caption": "woman portrait, natural light",
                  "description_ru": "Портрет женщины при естественном освещении",
              }, photo)
              catalog.set_descriptions(
                  photo,
                  "woman portrait, natural light",
                  "Портрет женщины при естественном освещении",
              )
              assert len(catalog.list_images("selected")) == 1
              assert not photo.with_suffix(".txt").exists(), "Processing must not create captions next to source photos"

              # Repeated captions reuse the SQLite translation cache rather than calling the API twice.
              api_calls = []
              original_translate = dataset_catalog.translate_en_ru_mymemory
              def fake_translate(text, email=""):
                  api_calls.append((text, email))
                  return "Пробный перевод"
              dataset_catalog.translate_en_ru_mymemory = fake_translate
              try:
                  assert catalog.translate_en_ru("common caption", "") == "Пробный перевод"
                  assert catalog.translate_en_ru("common caption", "") == "Пробный перевод"
                  assert len(api_calls) == 1, api_calls
              finally:
                  dataset_catalog.translate_en_ru_mymemory = original_translate

              catalog.set_status(photo, "rejected", "manual review")
              assert catalog.list_images("selected") == []
              assert len(catalog.list_images("rejected")) == 1
              catalog.set_status(photo, "selected", "")
              exported, skipped, output = catalog.export_selected(Path(tmp) / "export")
              assert (exported, skipped) == (1, 0), (exported, skipped)
              assert (output / "portrait.jpg").is_file()
              assert (output / "portrait.txt").read_text(encoding="utf-8").strip() == "woman portrait, natural light"
              assert (output / "captions_ru.csv").is_file()
              assert photo.read_bytes() == b"test image data; source file is intentionally opaque"
              assert not photo.with_suffix(".txt").exists()
          print("SQLite catalog, status changes, bilingual storage and explicit export: OK")
          PY
